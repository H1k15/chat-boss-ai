<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Boss AI</title>
    <style>
      :root {
        --blue: #1877f2;
        --ink: #1a202c;
        --muted: #64748b;
        --border: #e6e8eb;
        --green: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        width: 288px;
        margin: 0;
        color: var(--ink);
        background: #fff;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .head .logo { font-size: 22px; line-height: 1; }
      .head .title { font-weight: 700; font-size: 15px; }
      .head .sub { font-size: 11px; color: var(--muted); }

      .body { padding: 16px; }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        outline: none;
      }
      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.15);
      }
      button.primary {
        width: 100%;
        margin-top: 14px;
        padding: 10px;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      button.primary:hover { background: #166fe0; }
      button.primary:disabled { opacity: 0.6; cursor: default; }
      .err { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 15px; }

      /* Thẻ tài khoản sau khi đăng nhập */
      #account-view { padding: 16px; }
      .acct { display: flex; align-items: center; gap: 12px; }
      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--blue);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 17px;
        flex-shrink: 0;
      }
      .acct .name { font-weight: 600; font-size: 14px; }
      .acct .email { font-size: 12px; color: var(--muted); }
      .chip {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--green);
        margin: 16px 0;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
      button.ghost {
        width: 100%;
        padding: 9px;
        background: #fff;
        color: #dc2626;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      button.ghost:hover { background: #fef2f2; border-color: #fecaca; }
      .hidden { display: none !important; }

      /* Bong bóng thông báo */
      #toast {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%) translateY(-16px);
        background: var(--green);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
        white-space: nowrap;
        z-index: 10;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
  </head>
  <body>
    <div id="toast"></div>

    <div class="head">
      <span class="logo">🏠</span>
      <div>
        <div class="title">Chat Boss AI</div>
        <div class="sub">Trợ lý tư vấn phòng trọ</div>
      </div>
    </div>

    <form id="login-view" class="body">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="Nhập email" />
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Nhập mật khẩu" />
      <button type="submit" class="primary" id="login-btn">Đăng nhập</button>
      <div id="err" class="err"></div>
    </form>

    <div id="account-view" class="hidden">
      <div class="acct">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="name" id="acct-name">—</div>
          <div class="email" id="acct-email">—</div>
          <span class="chip" id="acct-role">—</span>
        </div>
      </div>
      <div class="status"><span class="dot"></span> Đang hoạt động</div>
      <button class="primary hidden" id="admin-btn" style="margin-top: 0">
        🛠️ Mở trang quản trị
      </button>
      <button class="ghost" id="logout-btn" style="margin-top: 8px">Đăng xuất</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
