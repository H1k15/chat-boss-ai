services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cba
      POSTGRES_PASSWORD: cba
      POSTGRES_DB: chat_boss_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      # Context phải là gốc repo: Dockerfile copy pnpm-workspace.yaml và
      # packages/shared, những thứ nằm ngoài apps/backend.
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"
    profiles: ["full"]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3001/api/v1}
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
  miniodata:
