services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cba
      POSTGRES_PASSWORD: cba
      POSTGRES_DB: chat_boss_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      # Context phải là gốc repo: Dockerfile copy pnpm-workspace.yaml và
      # packages/shared, những thứ nằm ngoài apps/backend.
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      # Ghi đè các URL hạ tầng: trong container "localhost" là chính container
      # đó, phải gọi theo tên service. .env giữ localhost cho lúc chạy trên máy.
      DATABASE_URL: postgresql://cba:cba@postgres:5432/chat_boss_ai?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Ollama chạy trên máy host, không phải trong mạng compose. Container gọi
      # ngược về host qua host.docker.internal (Docker Desktop tự phân giải).
      # .env giữ localhost:11434 cho lúc backend chạy thẳng trên máy.
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Cổng host đổi được để tránh đụng dịch vụ khác trên cùng máy.
      - "${BACKEND_PORT:-3001}:3001"
    profiles: ["full"]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3001/api/v1}
    env_file: .env
    depends_on:
      - backend
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
  miniodata:
